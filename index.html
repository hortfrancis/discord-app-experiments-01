<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Activity Experiment</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>Discord Activity</h1>
      <p id="status">Booting…</p>
      <section id="output" hidden>
        <div class="card">
          <h2>You</h2>
          <div id="user"></div>
        </div>
        <div class="card">
          <h2>Context</h2>
          <div id="context"></div>
        </div>
        <div class="card">
          <h2>Activity participants</h2>
          <ul id="participants"></ul>
        </div>
        <div class="card">
          <h2>Actions</h2>
          <div class="buttons">
            <button id="btn-activity" type="button">Set Rich Presence</button>
            <button id="btn-clear-activity" type="button">Clear presence</button>
            <button id="btn-invite" type="button">Invite people</button>
          </div>
          <p id="action-result" class="muted"></p>
        </div>
        <div class="card">
          <h2>Raw API data</h2>
          <p class="muted">Everything the SDK handed back — expand a section to explore.</p>
          <div id="debug"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
